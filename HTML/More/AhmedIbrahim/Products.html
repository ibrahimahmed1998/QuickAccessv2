<!DOCTYPE html>
<html lang="en">
<head id="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products</title>
    <link rel="icon" href="../../../css/icon1.jpg" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="../../../css/css/bootstrap.min.css" />
    <link rel="stylesheet" type="text/css" href="../../../css/new2.css" />
    <style>
        :root {
            --bg: #000;
            --panel: #0b1626;
            --panel-2: #10203a;
            --border: #1d3557;
            --accent: #23B5D3;
            --accent-2: #a71ea7;
            --text: #e9eef5;
            --muted: #8a9bb3;
            --ok: #2ecc71;
            --bad: #e74c3c;
        }

        body#test { background: radial-gradient(circle at top, #071a33 0%, var(--bg) 60%); color: var(--text); min-height: 100vh; }

        .products-wrap { max-width: 1100px; margin: 2.5rem auto; padding: 0 1rem; }

        .products-header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
        .products-header h1 { margin: 0; font-weight: 800; font-size: 2rem; background: linear-gradient(90deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .products-header p { margin: .25rem 0 0; color: var(--muted); }

        .stats { display: flex; gap: .75rem; }
        .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: .5rem 1rem; text-align: center; min-width: 90px; }
        .stat b { display: block; font-size: 1.35rem; color: var(--accent); }
        .stat span { font-size: .8rem; color: var(--muted); }

        .toolbar { display: flex; flex-wrap: wrap; gap: .75rem; margin-bottom: 1rem; }
        .toolbar input, .toolbar select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: .55rem .9rem; outline: none; transition: border-color .2s, box-shadow .2s; }
        .toolbar input { flex: 1 1 260px; }
        .toolbar input::placeholder { color: var(--muted); }
        .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(35, 181, 211, .2); }

        .table-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }
        .products-table { width: 100%; margin: 0; border-collapse: collapse; }
        .products-table thead th { background: var(--panel-2); color: var(--accent); text-transform: uppercase; letter-spacing: .05em; font-size: .8rem; padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
        .products-table thead th:hover { color: #fff; }
        .products-table thead th .arrow { opacity: .5; margin-left: .3rem; font-size: .7rem; }
        .products-table tbody td { color: var(--text); padding: .95rem 1.25rem; border-bottom: 1px solid rgba(29, 53, 87, .6); vertical-align: middle; }
        .products-table tbody tr { transition: background .15s; }
        .products-table tbody tr:hover { background: rgba(35, 181, 211, .07); }
        .products-table tbody tr:last-child td { border-bottom: none; }

        .name { font-weight: 600; font-size: 1.05rem; }
        .category { display: inline-block; padding: .2rem .65rem; border-radius: 999px; font-size: .8rem; background: rgba(167, 30, 167, .15); color: #e08ae0; border: 1px solid rgba(167, 30, 167, .4); }
        .price { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }

        .badge-status { display: inline-flex; align-items: center; gap: .4rem; padding: .25rem .7rem; border-radius: 999px; font-size: .8rem; font-weight: 600; }
        .badge-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .badge-status.in { color: var(--ok); background: rgba(46, 204, 113, .12); border: 1px solid rgba(46, 204, 113, .35); }
        .badge-status.out { color: var(--bad); background: rgba(231, 76, 60, .12); border: 1px solid rgba(231, 76, 60, .35); }
        tr.is-out .name, tr.is-out .price { opacity: .55; }

        .empty { display: none; padding: 2rem; text-align: center; color: var(--muted); }

        @media (max-width: 640px) {
            .products-table thead { display: none; }
            .products-table tbody tr { display: block; padding: .75rem 1rem; border-bottom: 1px solid var(--border); }
            .products-table tbody td { display: flex; justify-content: space-between; padding: .35rem 0; border: none; }
            .products-table tbody td::before { content: attr(data-label); color: var(--muted); font-size: .8rem; }
        }
    </style>
</head>
<body id="test">
    <script src="../../../js/nav.js"></script>

    <main class="products-wrap">
        <div class="products-header">
            <div>
                <h1>Products</h1>
                <p>Browse our kitchen appliances</p>
            </div>
            <div class="stats">
                <div class="stat"><b id="statTotal">0</b><span>Products</span></div>
                <div class="stat"><b id="statIn">0</b><span>In Stock</span></div>
            </div>
        </div>

        <div class="toolbar">
            <input id="search" type="search" placeholder="Search products..." aria-label="Search products">
            <select id="availability" aria-label="Filter by availability">
                <option value="all">All availability</option>
                <option value="in">In Stock</option>
                <option value="out">Out of Stock</option>
            </select>
        </div>

        <div class="table-card">
            <table class="products-table" id="productsTable">
                <thead>
                    <tr>
                        <th data-sort="name">Product Name<span class="arrow">&#8597;</span></th>
                        <th data-sort="category">Category<span class="arrow">&#8597;</span></th>
                        <th data-sort="price">Price<span class="arrow">&#8597;</span></th>
                        <th data-sort="status">Availability<span class="arrow">&#8597;</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr data-status="in">
                        <td data-label="Product Name" class="name" dir="rtl">الخلاط</td>
                        <td data-label="Category"><span class="category">Category 1</span></td>
                        <td data-label="Price" class="price">$10</td>
                        <td data-label="Availability"><span class="badge-status in">In Stock</span></td>
                    </tr>
                    <tr data-status="out">
                        <td data-label="Product Name" class="name" dir="rtl">خلاط و مزيل دهون</td>
                        <td data-label="Category"><span class="category">Category 2</span></td>
                        <td data-label="Price" class="price">$20</td>
                        <td data-label="Availability"><span class="badge-status out">Out of Stock</span></td>
                    </tr>
                    <tr data-status="in">
                        <td data-label="Product Name" class="name" dir="rtl">كاتيل</td>
                        <td data-label="Category"><span class="category">Category 3</span></td>
                        <td data-label="Price" class="price">$30</td>
                        <td data-label="Availability"><span class="badge-status in">In Stock</span></td>
                    </tr>
                    <tr data-status="in">
                        <td data-label="Product Name" class="name" dir="rtl">كاتيل و مزيل دهون</td>
                        <td data-label="Category"><span class="category">Category 3</span></td>
                        <td data-label="Price" class="price">$30</td>
                        <td data-label="Availability"><span class="badge-status in">In Stock</span></td>
                    </tr>
                </tbody>
            </table>
            <div class="empty" id="emptyState">No products match your search.</div>
        </div>
    </main>

    <script>
        (() => {
            const tbody = document.querySelector("#productsTable tbody");
            const rows = [...tbody.rows];
            const search = document.getElementById("search");
            const availability = document.getElementById("availability");
            const empty = document.getElementById("emptyState");

            rows.forEach(r => r.classList.toggle("is-out", r.dataset.status === "out"));
            document.getElementById("statTotal").textContent = rows.length;
            document.getElementById("statIn").textContent = rows.filter(r => r.dataset.status === "in").length;

            const applyFilters = () => {
                const q = search.value.trim().toLowerCase();
                const a = availability.value;
                let visible = 0;
                rows.forEach(r => {
                    const show = r.textContent.toLowerCase().includes(q) && (a === "all" || r.dataset.status === a);
                    r.style.display = show ? "" : "none";
                    if (show) visible++;
                });
                empty.style.display = visible ? "none" : "block";
            };
            search.addEventListener("input", applyFilters);
            availability.addEventListener("change", applyFilters);

            const getValue = (row, key) => {
                if (key === "price") return parseFloat(row.cells[2].textContent.replace(/[^\d.]/g, "")) || 0;
                if (key === "status") return row.dataset.status;
                return row.cells[key === "name" ? 0 : 1].textContent.trim();
            };
            let sortKey = null, asc = true;
            document.querySelectorAll("#productsTable th[data-sort]").forEach(th => {
                th.addEventListener("click", () => {
                    const key = th.dataset.sort;
                    asc = sortKey === key ? !asc : true;
                    sortKey = key;
                    rows.sort((x, y) => {
                        const a = getValue(x, key), b = getValue(y, key);
                        const cmp = typeof a === "number" ? a - b : String(a).localeCompare(String(b), ["ar", "en"]);
                        return asc ? cmp : -cmp;
                    }).forEach(r => tbody.appendChild(r));
                    document.querySelectorAll("#productsTable th .arrow").forEach(s => s.innerHTML = "&#8597;");
                    th.querySelector(".arrow").innerHTML = asc ? "&#9650;" : "&#9660;";
                });
            });
        })();
    </script>
</body>
</html>
