<script src="../js/ai-concepts-fallback.js"></script>
<script>
(async () => {
    const STORAGE_KEY = 'ai-last-concept-index';

    async function loadConcepts() {
        try {
            const response = await fetch('AI/AI_Concepts.html', { cache: 'no-store' });
            if (response.ok) {
                const html = await response.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const dataEl = doc.getElementById('concept-data');
                if (dataEl && dataEl.textContent.trim()) {
                    const parsed = JSON.parse(dataEl.textContent);
                    if (Array.isArray(parsed) && parsed.length) return parsed;
                }
            }
        } catch {
            // Fallback for file:// where fetch is blocked by browser CORS rules.
        }
        return Array.isArray(window.AI_CONCEPTS_FALLBACK) ? window.AI_CONCEPTS_FALLBACK : [];
    }

    function pickConceptIndex(length) {
        if (length <= 1) return 0;
        let lastIndex = -1;
        try {
            const saved = sessionStorage.getItem(STORAGE_KEY);
            if (saved !== null) lastIndex = Number.parseInt(saved, 10);
        } catch { }
        let nextIndex = Math.floor(Math.random() * length);
        if (nextIndex === lastIndex) {
            nextIndex = (nextIndex + 1 + Math.floor(Math.random() * (length - 1))) % length;
        }
        try {
            sessionStorage.setItem(STORAGE_KEY, String(nextIndex));
        } catch { }
        return nextIndex;
    }

    const concepts = await loadConcepts();
    if (!concepts.length) return;

    const concept = concepts[pickConceptIndex(concepts.length)];
    document.getElementById('concept-category').textContent = concept.category || 'General';
    document.getElementById('concept-title').textContent = concept.title || '';
    document.getElementById('concept-definition').textContent = concept.definition || '';
    document.getElementById('concept-example').textContent = concept.example || '';
    document.getElementById('concept-spotlight').hidden = false;
})();
</script>
